
# Nom de l'application
spring.application.name=gestion-comptes

# Port du serveur
server.port=8080

# Base de donnees H2 en memoire
spring.datasource.url=jdbc:h2:mem:comptesdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Creation automatique des tables
spring.jpa.hibernate.ddl-auto=create-drop

# Console H2
spring.h2.console.enabled=true

# Configuration JPA
spring.jpa.open-in-view=false

# Adresse de notre nouvelle API Spring Data REST
spring.data.rest.base-path=/data-rest
# Activer l'interface de test GraphiQL
spring.graphql.graphiql.enabled=true

# Adresse de notre API GraphQL
spring.graphql.http.path=/graphql